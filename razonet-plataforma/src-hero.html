<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Hero — Razonet plataforma</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--blue:#0171EB;--dark:#003159;--darker:#1C232D;--light:#CCE3FB;--mid:#4B9AF1;--middark:#0151A2}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1280px;height:720px;overflow:hidden}
  body{font-family:'Inter','Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
  .hero{position:relative;width:1280px;height:720px;overflow:hidden;background:radial-gradient(circle at 78% 30%,#0171EB 0%,#0151A2 34%,#003159 70%)}
  .ring{position:absolute;border-radius:50%;border:2px solid rgba(204,227,251,.18)}
  .r1{width:760px;height:760px;right:-120px;top:-180px}
  .r2{width:1060px;height:1060px;right:-270px;top:-330px}
  .screen{position:absolute;left:200px;top:150px;width:880px;border-radius:22px;overflow:hidden;background:#fff;
    box-shadow:0 50px 120px rgba(0,20,45,.55);border:10px solid #0e2440}
  .screen img{display:block;width:100%}
  .chip{position:absolute;display:flex;align-items:center;gap:16px;background:#fff;border-radius:20px;padding:16px 24px 16px 16px;
    box-shadow:0 26px 60px rgba(0,20,45,.45);color:var(--dark)}
  .ic{width:58px;height:58px;border-radius:15px;display:grid;place-items:center}
  .ic svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .chip small{display:block;font-size:15px;font-weight:600;color:#5a6e8c}
  .chip strong{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em}
  .c1{left:60px;top:70px;transform:rotate(-4deg)} .c1 .ic{background:#0171EB}
  .c2{right:50px;top:110px;transform:rotate(4deg)} .c2 .ic{background:#16B86A}
  .c3{left:40px;bottom:120px;transform:rotate(3deg)} .c3 .ic{background:#0151A2}
  .c4{right:70px;bottom:90px;transform:rotate(-3deg)} .c4 .ic{background:#7B3FE4}
</style>
</head>
<body>
<div class="hero">
  <div class="ring r2"></div><div class="ring r1"></div>
  <div class="screen"><img src="../assets/nova-tela-inicial/01-tela-inicio-menu.png" alt=""></div>

  <div class="chip c1"><div class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h3"/></svg></div><div><small>Conta digital</small><strong>BTG</strong></div></div>
  <div class="chip c2"><div class="ic"><svg viewBox="0 0 24 24"><path d="M12 3v18M16.5 7.5c0-1.7-2-3-4.5-3s-4.5 1.3-4.5 3 2 2.6 4.5 3 4.5 1.3 4.5 3-2 3-4.5 3-4.5-1.3-4.5-3"/></svg></div><div><small>Cobranças</small><strong>Asaas</strong></div></div>
  <div class="chip c3"><div class="ic"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg></div><div><small>Segurança do trabalho</small><strong>Laudos</strong></div></div>
  <div class="chip c4"><div class="ic"><svg viewBox="0 0 24 24"><path d="M12 4v16M5 20h14M6 8h12M6 8l-3 6a3 3 0 006 0zM18 8l-3 6a3 3 0 006 0z"/></svg></div><div><small>Assessoria</small><strong>Jurídica</strong></div></div>
</div>
</body>
</html>
